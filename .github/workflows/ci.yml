name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The floor is deliberately well below the current figure. CI installs only
      # [dev], so every model-backed component is skipped here and reports near-zero
      # coverage -- PerplexityDetector alone accounts for 26 of the uncovered lines.
      # Each further model-backed component drags the total down by a few points for
      # a legitimate reason, so a tight floor would reject correct work. This is a
      # regression guard, not a target: raise it only if it stops catching anything.
      - name: Run tests with coverage
        run: pytest -q --cov=humanizer_bench --cov-report=term-missing --cov-fail-under=75
